# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Just+ uses local Media3 AARs and Java switch statements over resource IDs.
# Keep the same resource/classpath behavior as upstream Just+ for the transition build.
android.useFullClasspathForDexingTransform=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# android-file-chooser is included as a subproject of the Just+ source tree.
VERSION_NAME=1.2.0
VERSION_CODE=102000
ANDROID_COMPILE_SDK_VERSION=34
ANDROID_MIN_SDK_VERSION=21
ANDROID_TARGET_SDK_VERSION=34
JAVA_COMPATIBILITY=VERSION_1_8
