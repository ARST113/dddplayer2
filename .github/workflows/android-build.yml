name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Just+ v1.2.0 transition source
        run: |
          bash scripts/prepare-justplus.sh
          bash scripts/fix-justplus-v015-gradle.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Just Player 0.0.15 debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :justplusapp:assembleLatestUniversalDebug \
            -PuseJustPlus=true \
            --stacktrace 2>&1 | tee ci-gradle.log

      - name: Save Gradle failure log to branch
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s ci-gradle.log
          CONTENT="$(base64 -w0 ci-gradle.log)"
          export CONTENT
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          export REF
          SHA="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/last-gradle.log?ref=${REF}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' || true)"
          export SHA
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          p = {"message": "ci: capture failed v0.0.15 Gradle log", "content": os.environ["CONTENT"], "branch": os.environ["REF"]}
          if os.environ.get("SHA"):
              p["sha"] = os.environ["SHA"]
          print(json.dumps(p))
          PY
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/last-gradle.log" \
            --data-binary @/tmp/payload.json

      - name: Fail after diagnostic capture
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Collect debug APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          APK="$(find .justplus-upstream/app/build/outputs/apk -type f -name '*.apk' | grep -i latest | grep -i debug | head -n1)"
          test -n "$APK"
          cp "$APK" build-artifacts/just-player-v0.0.15-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-player-v0.0.15-debug
          path: build-artifacts/just-player-v0.0.15-debug.apk
