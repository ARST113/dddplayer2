name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Just+ v1.2.0 transition source
        run: |
          bash scripts/prepare-justplus.sh
          bash scripts/fix-justplus-v015-gradle.sh

      - name: Inspect bundled FFmpeg extension
        run: |
          set -euo pipefail
          AAR=".justplus-upstream/app/libs/lib-decoder-ffmpeg-release.aar"
          unzip -p "$AAR" classes.jar > /tmp/ffmpeg-classes.jar
          echo "=== FFmpeg renderer classes ==="
          jar tf /tmp/ffmpeg-classes.jar | grep -E 'ExperimentalFfmpegVideoRenderer|FfmpegVideoDecoder|FfmpegAudioRenderer|FfmpegDecoder' || true

      - name: Build HEVC-capable Media3 FFmpeg extension
        run: bash scripts/build-media3-hevc-ffmpeg.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Just Player 0.0.15 debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :justplusapp:assembleLatestUniversalDebug \
            -PuseJustPlus=true \
            --stacktrace 2>&1 | tee ci-gradle.log

      - name: Upload Gradle log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.0.15-gradle-log-${{ github.run_number }}
          path: ci-gradle.log
          if-no-files-found: error

      - name: Fail after diagnostic capture
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Collect debug APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          APK="$(find .justplus-upstream/app/build/outputs/apk -type f -name '*.apk' | grep -i latest | grep -i debug | head -n1)"
          test -n "$APK"
          cp "$APK" build-artifacts/just-player-v0.0.15-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-player-v0.0.15-debug
          path: build-artifacts/just-player-v0.0.15-debug.apk
