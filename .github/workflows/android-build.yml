name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Just+ v1.2.0 transition source
        run: |
          bash scripts/prepare-justplus.sh
          bash scripts/fix-justplus-v015-gradle.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Just Player 0.0.15 debug APK
        run: |
          ./gradlew :justplusapp:assembleLatestUniversalDebug \
            -PuseJustPlus=true \
            --stacktrace

      - name: Collect debug APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          APK="$(find .justplus-upstream/app/build/outputs/apk -type f -name '*.apk' | grep -i latest | grep -i debug | head -n1)"
          test -n "$APK"
          cp "$APK" build-artifacts/just-player-v0.0.15-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-player-v0.0.15-debug
          path: build-artifacts/just-player-v0.0.15-debug.apk
